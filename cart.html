<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Bookstore</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      .container {
        width: 80%;
        margin: auto;
      }
      .book-list,
      .cart-container {
        margin-top: 20px;
      }
      .book {
        display: inline-block;
        width: 30%;
        margin: 10px;
        padding: 10px;
        background: #f9f9f9;
        border: 1px solid #ddd;
        text-align: center;
      }
      .cart-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
      }
      .cart-summary {
        margin-top: 20px;
        text-align: center;
      }
      .cart-summary button {
        padding: 10px 20px;
        background: #28a745;
        color: white;
        border: none;
        cursor: pointer;
      }
      .recommendations {
        margin-top: 20px;
        text-align: center;
        display: none;
      }
      .checkout {
        text-align: center;
        margin-top: 20px;
        display: none; /* Initially hidden */
      }
      .checkout button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav">
        <div class="logo">
          <a href="http://localhost:3000/books" target="_blank"></a>
          <img src="/images/logo(new).webp" alt="Website Logo" />
        </div>
        <ul class="nav-list">
          <li><a href="http://localhost:3000/books">Books</a></li>
          <li><a href="http://localhost:3000/login">Login</a></li>
          <li><a href="http://localhost:3000/cart">Cart</a></li>
          <li><a href="http://localhost:3000/aboutus">About Us</a></li>
        </ul>
        <div class="search-bar">
          <input type="text" name="search" id="search" placeholder="Search..." />
          <button class="btn" onclick="performSearch()">Search</button>
        </div>
      </div>
    </header>
    <div class="container">
      <h1>Online Bookstore</h1>
      <div class="book-list" id="book-list"></div>
      <button onclick="showCartPage()">Go to Cart</button>
      <div class="cart-container" style="display: none">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items"></div>
        <div class="cart-summary">
          <p>Total: ₹<span id="total-price">0</span></p>
          <button onclick="emptyCart()">Empty Cart</button>
          <button onclick="checkout()">Checkout</button>
        </div>
        <div class="recommendations" id="recommendations">
          <h3>Recommended Books</h3>
          <div id="recommended-books"></div>
        </div>
        <button onclick="showHomepage()">Back to Homepage</button>
        <div class="checkout" id="checkout-div">
        </div>
      </div>
    </div>
    <script>
      var books = [
        { id: 1, title: "1984", author: "George Orwell", price: 1250, img: "https://m.media-amazon.com/images/I/71kxa1-0mfL._AC_UY327_FMwebp_QL65_.jpg" },
        { id: 2, title: "The Great Gatsby", author: "F. Scott Fitzgerald", price: 1000, img: "https://m.media-amazon.com/images/I/81xXAyG1yXL._AC_UY327_FMwebp_QL65_.jpg" }
      ];
      var cart = [];
      
      function displayBooks() {
        var bookList = document.getElementById("book-list");
        bookList.innerHTML = "";
        books.forEach(function (book) {
          var bookDiv = document.createElement("div");
          bookDiv.classList.add("book");
          bookDiv.innerHTML = `
            <img src="${book.img}" alt="${book.title}" style="width:100px; height:150px;"><br>
            <h4>${book.title}</h4>
            <p>Author: ${book.author}</p>
            <p>Price: ₹${book.price}</p>
            <button onclick="addToCart(${book.id})">Add to Cart</button>
          `;
          bookList.appendChild(bookDiv);
        });
      }

      function addToCart(bookId) {
        var book = books.find((b) => b.id === bookId);
        var existingItem = cart.find((item) => item.id === bookId);
        if (existingItem) {
          existingItem.quantity++;
        } else {
          cart.push({ ...book, quantity: 1 });
        }
      }

      function showCartPage() {
        document.querySelector(".book-list").style.display = "none";
        document.querySelector(".cart-container").style.display = "block";
        document.querySelector(".checkout").style.display = "block"; // Ensure visibility
        updateCart();
      }

      function showHomepage() {
        document.querySelector(".book-list").style.display = "block";
        document.querySelector(".cart-container").style.display = "none";
      }

      function updateCart() {
        var cartItemsContainer = document.getElementById("cart-items");
        var totalPriceElement = document.getElementById("total-price");
        var checkoutDiv = document.getElementById("checkout-div");
        cartItemsContainer.innerHTML = "";
        var totalPrice = 0;
        if (cart.length === 0) {
          checkoutDiv.style.display = "none"; // Hide checkout if cart is empty
        } else {
          checkoutDiv.style.display = "block"; // Show checkout if cart has items
        }
        cart.forEach(function (item) {
          var itemDiv = document.createElement("div");
          itemDiv.classList.add("cart-item");
          itemDiv.innerHTML = `
            <span>${item.title} - ₹${item.price}</span>
            <input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, this.value)">
            <button onclick="removeFromCart(${item.id})">Remove</button>
          `;
          cartItemsContainer.appendChild(itemDiv);
          totalPrice += item.price * item.quantity;
        });
        totalPriceElement.textContent = totalPrice;
      }

      function updateQuantity(bookId, quantity) {
        var item = cart.find((item) => item.id === bookId);
        if (item) {
          item.quantity = parseInt(quantity);
        }
        updateCart();
      }

      function removeFromCart(bookId) {
        cart = cart.filter((item) => item.id !== bookId);
        updateCart();
      }

      function emptyCart() {
        cart = [];
        updateCart();
      }

      function checkout() {
        alert("Proceeding to checkout...");
      }

      displayBooks();
    </script>
  </body>
</html>
